# DBX official plugin release flow (the reusable workflow Plan Detective runs).
#
# A published GitHub Release builds the unsigned candidate, validates the
# artifact metadata against the real package bytes, rejects a `signature.json`
# and uploads the `.dbxp` plus a merged `release-candidates.json` to the
# Release. Repository signing stays with DBX Store, so this workflow holds no
# signing key and uses no secret beyond the default `contents: write` token.
#
# `package-command` is `npm run build` (scripts/build.mjs) instead of
# `dbx-plugin package .`: SchemaSeed's backend is the platform-independent Node
# runtime launched from `bin/universal/`, which the official CLI cannot stage
# (it builds Rust/Go sidecars from `[backend]`), and `ui/src/**` is vendored by
# the build instead of being checked in. `scripts/build.mjs` produces exactly
# one `.dbxp` and one `.artifact.json` for `DBX_PLUGIN_TARGET`, which is the
# package command contract of this reusable workflow.
name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.9
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: npm run build
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      install-plugin-cli: false
      build-matrix: >-
        {"include":[{"runner":"ubuntu-24.04","target":"universal"}]}
