# The UI-only universal package is built with DBX's official plugin CLI. The
# build script stages the reachable, browser-safe Generation Core module graph
# under ui/src before invoking `dbx-plugin package`; Node is build-only.
name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.9
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: npm ci && npm run build
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      install-plugin-cli: false
      build-matrix: >-
        {"include":[{"runner":"ubuntu-24.04","target":"universal"}]}
